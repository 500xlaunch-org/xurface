[project]
name = "xurface"
version = "0.2.0"
description = "Xurface SDK: give your AI agents a record and a conscience. Declare, then guard."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/500xlaunch-org/xurface"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xurface*"]
